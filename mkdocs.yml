site_name: aquimodpy
theme:
  name: material

nav:
  - Home: index.md
  - API Reference: api.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            members_order: source
            show_if_no_docstring: true
            show_bases: true
            show_source: true
            show_submodules: true


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
